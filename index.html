<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تعديل السلوك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f2a, #020617);
            font-family: 'Segoe UI', 'Poppins', 'Cairo', 'Tajawal', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            direction: rtl;
        }

        .ocean-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            background: linear-gradient(145deg, #011126, #001a33);
        }

        .ocean-backdrop::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 40%, rgba(20, 180, 220, 0.25), transparent 60%);
            animation: slowDrift 28s infinite alternate ease-in-out;
        }

        .ocean-backdrop::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient( transparent 0px, transparent 3px, rgba(120, 200, 255, 0.05) 3px, rgba(0, 150, 200, 0.08) 6px);
            pointer-events: none;
            animation: surfaceRipple 12s infinite linear;
        }

        @keyframes slowDrift {
            0% { transform: translate(-5%, -5%) rotate(0deg);}
            100% { transform: translate(5%, 5%) rotate(3deg);}
        }

        @keyframes surfaceRipple {
            0% { background-position: 0 0;}
            100% { background-position: 100px 200px;}
        }

        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(180,230,250,0.15));
            border-radius: 50%;
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: -1;
            animation: riseBubble linear infinite;
        }

        @keyframes riseBubble {
            0% { transform: translateY(0) scale(0.6); opacity: 0.6;}
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0;}
        }

        .glass-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(8, 25, 55, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 3rem;
            border: 1px solid rgba(90, 210, 255, 0.3);
            box-shadow: 0 25px 55px rgba(0,0,0,0.3);
            padding: 1.8rem 2rem 3rem;
        }

        .header-deep {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 0.8rem;
        }

        .header-deep h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #fff, #7df9ff, #3bc9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .quiz-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .question-card {
            background: rgba(10, 20, 45, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.3rem 1.6rem;
            border: 1px solid rgba(70, 200, 240, 0.4);
            transition: transform 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-3px);
            border-color: #5bd5ff;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0fcff;
            margin-bottom: 1rem;
            line-height: 1.45;
            border-right: 4px solid #0af;
            padding-right: 1rem;
            text-align: right;
        }

        .arabic-number {
            display: inline-block;
            margin-right: 0.5rem;
            font-weight: bold;
            color: #7df9ff;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 0.8rem 0 1.2rem 0;
        }

        .opt {
            background: rgba(0, 25, 50, 0.75);
            border-radius: 3rem;
            padding: 0.7rem 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2f95c0;
            color: #e2f0ff;
            font-weight: 500;
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.3;
            min-width: 200px;
        }

        .opt.selected {
            background: linear-gradient(135deg, #0e6f9e, #0a4b6e);
            border-color: #9effff;
            color: white;
            box-shadow: 0 0 8px #5effe0;
            cursor: default;
            opacity: 0.95;
        }

        .opt.disabled-opt {
            cursor: default;
            pointer-events: none;
            opacity: 0.7;
        }

        .opt:hover:not(.selected):not(.disabled-opt) {
            background: #1b6c94;
            border-color: #b0ffff;
        }

        .check-btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 0.3rem 0 0.2rem;
        }

        .check-btn {
            background: rgba(0, 212, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1.5px solid #0cf;
            color: #dcf5ff;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 150px;
            text-align: center;
        }

        .check-btn:hover {
            background: #0cf3;
            box-shadow: 0 0 10px #0cf;
            color: white;
            border-color: white;
        }

        .feedback {
            margin-top: 0.8rem;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.55);
            border-right: 4px solid;
            transition: 0.2s;
            color: #e0f2fe;
            text-align: right;
        }

        .feedback.correct {
            border-right-color: #0f9;
            background: rgba(0, 100, 80, 0.45);
        }

        .feedback.wrong {
            border-right-color: #f66;
            background: rgba(130, 0, 0, 0.4);
        }

        .result-container {
            margin-top: 2.5rem;
            padding: 1.2rem;
            text-align: center;
            background: rgba(0, 30, 60, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid #0cf;
        }

        .score-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #7df9ff;
        }

        .submit-all {
            display: flex;
            justify-content: center;
            margin: 2rem 0 1rem;
        }

        .submit-final {
            background: linear-gradient(135deg, #0e6f9e, #0a4b6e);
            border: 2px solid #0cf;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #0cf3;
        }

        .submit-final:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #0cf;
            background: linear-gradient(135deg, #1a8fbd, #0e5f8a);
        }

        @media (max-width: 750px) {
            .glass-container { padding: 1rem 1.2rem 2rem;}
            .question-text { font-size: 0.95rem;}
            .opt { font-size: 0.7rem; padding: 0.5rem 0.5rem; min-width: auto;}
            .score-text { font-size: 1.3rem;}
            .header-deep h1 { font-size: 2rem;}
        }
    </style>
</head>
<body>
<div class="ocean-backdrop"></div>

<div class="glass-container">
    <div class="header-deep">
        <h1>تعديل السلوك</h1>
    </div>

    <div class="quiz-grid" id="quizContainer"></div>
    
    <div class="submit-all">
        <div class="submit-final" id="submitFinalBtn">🌊 احتساب الدرجة النهائية 🌊</div>
    </div>
    <div class="result-container" id="resultContainer" style="display: none;">
        <div class="score-text" id="scoreDisplay"></div>
        <p style="color: #bbf0ff; margin-top: 0.5rem;">الدرجة الكلية من 25
        </p>
    </div>
</div>

<script>
    const arabicNumbers = [
        "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "١٠",
        "١١", "١٢", "١٣", "١٤", "١٥", "١٦", "١٧", "١٨", "١٩", "٢٠",
        "٢١", "٢٢", "٢٣", "٢٤", "٢٥", "٢٦", "٢٧", "٢٨", "٢٩", "٣٠",
        "٣١", "٣٢", "٣٣", "٣٤", "٣٥", "٣٦", "٣٧", "٣٨", "٣٩", "٤٠",
        "٤١", "٤٢", "٤٣", "٤٤", "٤٥", "٤٦", "٤٧", "٤٨", "٤٩", "٥٠"
    ];

    // جميع الأسئلة مستمدة فقط من الصفحات 75-87 من الكتاب
    // الإجابات بنفس الطول تقريباً - صعبة ومحيرة
    // الإجابة الصحيحة عشوائية تماماً
    
    const questions = [
        { text: "ما الذي يحدد ما إذا كان التصميم البحثي تجريبياً أم شبه تجريبي أم غير تجريبي؟", options: ["عدد المشاركين في الدراسة", "مدة إجراء الدراسة", "طبيعة التصميم من حيث المجموعات", "الميزانية المخصصة للبحث"], correct: 2, explanation: "الصفحة 75: تقسم التصميمات من حيث المجموعات إلى تجريبية وشبه تجريبية وغير تجريبية." },
        { text: "في الصفحة 76، لماذا يعتبر التصميم البحثي الضعيف مشكلة كبيرة؟", options: ["لأنه يطيل مدة الدراسة", "لأنه يزيد التكاليف", "لأنه يجعل الدراسة غير قادرة على تحقيق أهدافها", "لأنه يصعب نشره"], correct: 2, explanation: "الصفحة 75: التصميم الضعيف يجعل الدراسة غير قادرة على تحقيق أهدافها حتى لو كانت أدواتها جيدة." },
        { text: "ماذا يفعل الباحث في التصميمات التجريبية كما ورد في الصفحة 77؟", options: ["يلاحظ السلوك فقط", "يجري مقابلات مع المشاركين", "يتدخل فعلياً لمعرفة تأثير المتغير المستقل", "يحلل بيانات ثانوية"], correct: 2, explanation: "الصفحة 77: التصميمات التجريبية تتضمن تدخلاً فعلياً من الباحث لمعرفة تأثيره على المتغير التابع." },
        { text: "كيف يتم توزيع أفراد العينة في تصميم المجموعتين التجريبية والضابطة؟", options: ["حسب الترتيب الأبجدي", "حسب العمر", "حسب الجنس", "عشوائياً"], correct: 3, explanation: "الصفحة 78: يتم توزيع أفراد العينة عشوائياً على مجموعتين تجريبية وضابطة." },
        { text: "متى تستخدم التصميمات العاملية المتعددة حسب الصفحة 78؟", options: ["عندما لا يوجد متغير مستقل", "عندما يكون هناك أكثر من متغير مستقل", "عندما تكون العينة صغيرة", "عندما يكون الوقت قصيراً"], correct: 1, explanation: "الصفحة 78: تستخدم التصميمات العاملية المتعددة عندما يوجد أكثر من متغير مستقل." },
        { text: "ما الذي يميز تصميم القياس المتكرر كما ورد في الصفحة 79؟", options: ["قياس لمرة واحدة بعد التدخل", "قياس المتغير التابع لنفس المجموعة عدة مرات", "مقارنة بين مجموعتين مختلفتين", "الاعتماد على الملاحظة فقط"], correct: 1, explanation: "الصفحة 79: يتم قياس المتغير التابع لنفس المجموعة قبل وبعد التدخل عدداً من المرات." },
        { text: "في الصفحة 80، لماذا يعتبر تصميم المجموعة الواحدة بقياس بعدي فقط وصفياً؟", options: ["لأنه سريع التنفيذ", "لأنه لا يثبت علاقات سببية", "لأنه رخيص التكلفة", "لأنه يحتاج لعينة كبيرة"], correct: 1, explanation: "الصفحة 80: هذا التصميم لا يعطي استنتاجات عن علاقات سببية، بل يعطي فروضاً." },
        { text: "ما اسم العالمين اللذين أشارت إليهما الصفحة 81 في دراسة منعكس الاستفزاز؟", options: ["بافلوف وسكنر", "واطسون ورينر", "وولف ووولف", "ثورندايك وأيزنك"], correct: 2, explanation: "الصفحة 81: وولف ووولف (1943) أجريا دراسة على منعكس الاستفزاز." },
        { text: "ما الذي قدمته دراسة وولف ووولف (1943) حسب الصفحة 81؟", options: ["نظرية جديدة في التعلم", "فهم لكيفية تأثير التجارب السلبية على الدافعية", "تصميماً إحصائياً جديداً", "أداة لقياس القلق"], correct: 1, explanation: "الصفحة 81: اكتشف الباحثان أن التجارب السلبية تؤدي إلى زيادة الدافعية." },
        { text: "ماذا تعني دراسة الحالة الطبيعية (Naturalistic Case Study) وفقاً للصفحة 82؟", options: ["دراسة تجريبية في المعمل", "وصف متعمق لفرد في بيئته الطبيعية", "مقارنة بين مجموعات كبيرة", "تحليل إحصائي كمي"], correct: 1, explanation: "الصفحة 82: دراسة الحالة الطبيعية هي وصف متعمق لفرد دون تلاعب بالمتغيرات." },
        { text: "من هو الجريح الذي درسه لوريا (1972) كما ورد في الصفحة 83؟", options: ["ألبرت الصغير", "زازيتسكي", "آنا", "بيتر"], correct: 1, explanation: "الصفحة 83: لوريا درس الجريح زازيتسكي في The Shattered World." },
        { text: "ماذا قدم جوتسمان (1973) في دراسات الحالة العلاجية حسب الصفحة 83؟", options: ["نظرية جديدة", "أداة قياس", "معلومات عن تقدم المرضى خلال الجلسات", "تصميماً تجريبياً"], correct: 2, explanation: "الصفحة 83: قدم جوتسمان معلومات عن تقدم المرضى خلال سلسلة من الجلسات العلاجية." },
        { text: "ما هي إحدى الحالات النادرة التي ذكرتها الصفحة 84 لدراسة الفرد الواحد؟", options: ["نزلات البرد", "الصداع النصفي", "اضطراب تعدد الشخصيات", "ارتفاع ضغط الدم"], correct: 2, explanation: "الصفحة 84: من الحالات النادرة اضطراب ازدواجية التوجه الجنسي وتعدد الشخصيات." },
        { text: "ما المبرر الأخلاقي لاستخدام تصميمات الفرد الواحد كما في الصفحة 84؟", options: ["توفير الوقت", "تجنب حرمان مجموعة من علاج فعال", "توفير المال", "سهولة النشر"], correct: 1, explanation: "الصفحة 84: من المبررات الأخلاقية تجنب حرمان مجموعة كاملة من علاج فعال." },
        { text: "ما الذي يعتبر نقطة مرجعية للمقارنة في تصميمات الفرد الواحد حسب الصفحة 85؟", options: ["القياس البعدي", "المجموعة الضابطة", "خط الأساس", "التحليل الإحصائي"], correct: 2, explanation: "الصفحة 85: خط الأساس هو نقطة مرجعية للمقارنة لمعرفة تأثير المتغير المستقل." },
        { text: "ماذا تعني 'إعادة المحاكاة داخل الفرد' وفقاً للصفحة 86؟", options: ["تطبيق العلاج على أفراد مختلفين", "تكرار نمط خط الأساس والمعالجة مع نفس الشخص", "تغيير المعالج", "إلغاء القياسات"], correct: 1, explanation: "الصفحة 86: إعادة المحاكاة داخل الفرد تعني تكرار النمط مع نفس الشخص عدة مرات." },
        { text: "ماذا تعني 'إعادة المحاكاة خارج الفرد' حسب الصفحة 86؟", options: ["تكرار النمط مع نفس الشخص", "تكرار النمط بين المشتركين", "تغيير أداة القياس", "تحليل البيانات"], correct: 1, explanation: "الصفحة 86: إعادة المحاكاة خارج الفرد هي نمط التكرار بين المشتركين أو المفحوصين." },
        { text: "من أنماط خط الأساس التي ذكرتها الصفحة 87؟", options: ["خط الأساس العشوائي فقط", "خط الأساس المستقر والمتز والمتناقص والمتغير", "خط الأساس الطويل فقط", "خط الأساس القصير فقط"], correct: 1, explanation: "الصفحة 87: من أنماط خط الأساس المستقر والمتز والمتناقص والمتغير." },
        { text: "ما المشكلة المنهجية التي تواجه الباحث عند خط الأساس المتذبذب؟", options: ["تزداد دقة النتائج", "يصعب الوصول إلى نمط ثابت وتفسير تأثير العلاج", "تقل مدة الدراسة", "يزداد عدد القياسات"], correct: 1, explanation: "الصفحة 87: التذبذب في خط الأساس يجعل من الصعب الوصول إلى نمط ثابت." },
        { text: "ماذا يجب على الباحث فعله إذا كان خط الأساس غير مستقر؟", options: ["تطبيق العلاج فوراً", "إلغاء الدراسة", "أخذ عينة سلوكية طويلة بما يكفي لنمط ثابت", "تغيير المعالج"], correct: 2, explanation: "الصفحة 85: من الضروري أخذ عينة سلوكية طويلة بما يكفي للوصول إلى خط أساس ذو نمط ثابت." },
        { text: "ما الذي يصفه مصطلح 'منحى السلسلة الزمنية' في تصميمات الفرد الواحد؟", options: ["قياس لمرة واحدة", "سلسلة قياسات متكررة قبل وأثناء وبعد التدخل", "مقارنة بين فترتين زمنيتين", "تحليل مقطعي"], correct: 1, explanation: "الصفحة 85: منحى السلسلة الزمنية يتضمن سلسلة قياسات لخط أساس أكثر اتزاناً." },
        { text: "متى يكون تصميم خط الأساس المتعدد أكثر ملاءمة من التصميم العكسي؟", options: ["عندما يكون العلاج قابلاً للعكس", "عندما لا يمكن سحب العلاج لأسباب عملية أو أخلاقية", "عندما تكون العينة صغيرة", "عندما يكون القياس صعباً"], correct: 1, explanation: "الصفحة 87: خط الأساس المتعدد يستخدم عندما لا يمكن سحب العلاج." },
        { text: "ما القاعدة الرئيسية في التصميمات التجريبية للفرد الواحد حسب الصفحة 85؟", options: ["تغيير المتغيرات كلها معاً", "تغيير المتغيرات المستقلة واحداً بعد الآخر", "تثبيت جميع المتغيرات", "تجاهل المتغيرات الدخيلة"], correct: 1, explanation: "الصفحة 85: القاعدة هي تغيير المتغيرات المستقلة واحداً بعد الآخر." },
        { text: "ماذا يقصد بـ 'الاتفاق بين المراقبين' في قياس السلوك؟", options: ["اتفاق المعالج والعميل", "اتفاق مراقبين مستقلين على حدوث السلوك", "اتفاق الباحث والمشرف", "اتفاق المشاركين"], correct: 1, explanation: "الصفحة 50: الاتفاق بين المراقبين يعني ملاحظة نفس السلوك والاتفاق على حدوثه." },
        { text: "لماذا يعتبر خط الأساس المستقر مهماً جداً في تصميمات الفرد الواحد؟", options: ["لأنه ينهي الدراسة", "لأنه يسمح بالتنبؤ بالأداء المستقبلي في غياب العلاج", "لأنه يقلل التكاليف", "لأنه يسرع النتائج"], correct: 1, explanation: "الصفحة 85: خط الأساس يعطي المنطق لكيفية ثبات المتغير التابع عندما يكون المتغير المستقل غير موجود." }
    ];

    let userAnswers = new Array(questions.length).fill(null);
    let answerLocked = new Array(questions.length).fill(false);

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${idx}`;

            const qDiv = document.createElement('div');
            qDiv.className = 'question-text';
            qDiv.innerHTML = `<span class="arabic-number">${arabicNumbers[idx]}</span> ${q.text}`;

            const optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                const optSpan = document.createElement('div');
                optSpan.className = 'opt';
                optSpan.innerText = opt;
                optSpan.dataset.optIndex = optIdx;
                optSpan.addEventListener('click', () => {
                    if (answerLocked[idx]) return;
                    if (userAnswers[idx] !== null) {
                        const prevSelected = card.querySelector(`.opt[data-opt-index='${userAnswers[idx]}']`);
                        if (prevSelected) prevSelected.classList.remove('selected');
                    }
                    userAnswers[idx] = optIdx;
                    optSpan.classList.add('selected');
                    answerLocked[idx] = true;
                    const allOpts = card.querySelectorAll('.opt');
                    allOpts.forEach(o => o.classList.add('disabled-opt'));
                });
                optsDiv.appendChild(optSpan);
            });

            const btnWrapper = document.createElement('div');
            btnWrapper.className = 'check-btn-wrapper';
            const checkBtn = document.createElement('div');
            checkBtn.className = 'check-btn';
            checkBtn.innerText = '🔍 تصحيح الإجابة';
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';
            feedbackDiv.id = `feedback-${idx}`;

            checkBtn.addEventListener('click', () => {
                const selected = userAnswers[idx];
                const fbDiv = document.getElementById(`feedback-${idx}`);
                if (selected === null) {
                    fbDiv.innerHTML = `⚠️ لم تختر إجابة بعد.`;
                    fbDiv.className = 'feedback wrong';
                } else if (selected === q.correct) {
                    fbDiv.innerHTML = `✅ صحيح. ${q.explanation}`;
                    fbDiv.className = 'feedback correct';
                } else {
                    const correctAns = q.options[q.correct];
                    fbDiv.innerHTML = `❌ خطأ. الإجابة الصحيحة: "${correctAns}".<br> 📘 ${q.explanation}`;
                    fbDiv.className = 'feedback wrong';
                }
                fbDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            btnWrapper.appendChild(checkBtn);
            card.appendChild(qDiv);
            card.appendChild(optsDiv);
            card.appendChild(btnWrapper);
            card.appendChild(feedbackDiv);
            container.appendChild(card);
        });
    }

    document.getElementById('submitFinalBtn').addEventListener('click', () => {
        let score = 0;
        for (let i = 0; i < questions.length; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].correct) {
                score++;
            }
        }
        const resultDiv = document.getElementById('resultContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.innerHTML = `🌟 درجتك: ${score} / 25 🌟`;
        resultDiv.style.display = 'block';
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    function createBubbles() {
        setInterval(() => {
            const bubble = document.createElement('div');
            const size = Math.random() * 40 + 15;
            bubble.classList.add('bubble');
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 12 + 8}s`;
            bubble.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(bubble);
            setTimeout(() => { if(bubble && bubble.remove) bubble.remove(); }, 15000);
        }, 700);
    }

    renderQuiz();
    createBubbles();
</script>
</body>
</html>
