<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تعديل السلوك</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f2a, #020617);
            font-family: 'Segoe UI', 'Poppins', 'Cairo', 'Tajawal', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        .ocean-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            background: linear-gradient(145deg, #011126, #001a33);
        }

        .ocean-backdrop::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 40%, rgba(20, 180, 220, 0.25), transparent 60%);
            animation: slowDrift 28s infinite alternate ease-in-out;
        }

        .ocean-backdrop::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient( transparent 0px, transparent 3px, rgba(120, 200, 255, 0.05) 3px, rgba(0, 150, 200, 0.08) 6px);
            pointer-events: none;
            animation: surfaceRipple 12s infinite linear;
        }

        @keyframes slowDrift {
            0% { transform: translate(-5%, -5%) rotate(0deg);}
            100% { transform: translate(5%, 5%) rotate(3deg);}
        }

        @keyframes surfaceRipple {
            0% { background-position: 0 0;}
            100% { background-position: 100px 200px;}
        }

        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(180,230,250,0.15));
            border-radius: 50%;
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: -1;
            animation: riseBubble linear infinite;
        }

        @keyframes riseBubble {
            0% { transform: translateY(0) scale(0.6); opacity: 0.6;}
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0;}
        }

        .glass-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(8, 25, 55, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 3rem;
            border: 1px solid rgba(90, 210, 255, 0.3);
            box-shadow: 0 25px 55px rgba(0,0,0,0.3);
            padding: 1.8rem 2rem 3rem;
        }

        .header-deep {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 0.8rem;
        }

        .header-deep h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #fff, #7df9ff, #3bc9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .quiz-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .question-card {
            background: rgba(10, 20, 45, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.3rem 1.6rem;
            border: 1px solid rgba(70, 200, 240, 0.4);
            transition: transform 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-3px);
            border-color: #5bd5ff;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0fcff;
            margin-bottom: 1rem;
            line-height: 1.45;
            border-left: 4px solid #0af;
            padding-left: 1rem;
        }

        .arabic-number {
            display: inline-block;
            margin-left: 0.5rem;
            font-weight: bold;
            color: #7df9ff;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 0.8rem 0 1.2rem 0;
        }

        .opt {
            background: rgba(0, 25, 50, 0.75);
            border-radius: 3rem;
            padding: 0.7rem 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2f95c0;
            color: #e2f0ff;
            font-weight: 500;
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.3;
            min-width: 200px;
        }

        .opt.selected {
            background: linear-gradient(135deg, #0e6f9e, #0a4b6e);
            border-color: #9effff;
            color: white;
            box-shadow: 0 0 8px #5effe0;
            cursor: default;
            opacity: 0.95;
        }

        .opt.disabled-opt {
            cursor: default;
            pointer-events: none;
            opacity: 0.7;
        }

        .opt:hover:not(.selected):not(.disabled-opt) {
            background: #1b6c94;
            border-color: #b0ffff;
        }

        .check-btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 0.3rem 0 0.2rem;
        }

        .check-btn {
            background: rgba(0, 212, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1.5px solid #0cf;
            color: #dcf5ff;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 150px;
            text-align: center;
        }

        .check-btn:hover {
            background: #0cf3;
            box-shadow: 0 0 10px #0cf;
            color: white;
            border-color: white;
        }

        .feedback {
            margin-top: 0.8rem;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.55);
            border-right: 4px solid;
            transition: 0.2s;
            color: #e0f2fe;
        }

        .feedback.correct {
            border-right-color: #0f9;
            background: rgba(0, 100, 80, 0.45);
        }

        .feedback.wrong {
            border-right-color: #f66;
            background: rgba(130, 0, 0, 0.4);
        }

        .result-container {
            margin-top: 2.5rem;
            padding: 1.2rem;
            text-align: center;
            background: rgba(0, 30, 60, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid #0cf;
        }

        .score-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #7df9ff;
        }

        .submit-all {
            display: flex;
            justify-content: center;
            margin: 2rem 0 1rem;
        }

        .submit-final {
            background: linear-gradient(135deg, #0e6f9e, #0a4b6e);
            border: 2px solid #0cf;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px #0cf3;
        }

        .submit-final:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #0cf;
            background: linear-gradient(135deg, #1a8fbd, #0e5f8a);
        }

        @media (max-width: 750px) {
            .glass-container { padding: 1rem 1.2rem 2rem;}
            .question-text { font-size: 0.95rem;}
            .opt { font-size: 0.7rem; padding: 0.5rem 0.5rem; min-width: auto;}
            .score-text { font-size: 1.3rem;}
            .header-deep h1 { font-size: 2rem;}
        }
    </style>
</head>
<body>
<div class="ocean-backdrop"></div>

<div class="glass-container">
    <div class="header-deep">
        <h1>تعديل السلوك</h1>
    </div>

    <div class="quiz-grid" id="quizContainer"></div>
    
    <div class="submit-all">
        <div class="submit-final" id="submitFinalBtn">🌊 احتساب الدرجة النهائية 🌊</div>
    </div>
    <div class="result-container" id="resultContainer" style="display: none;">
        <div class="score-text" id="scoreDisplay"></div>
        <p style="color: #bbf0ff; margin-top: 0.5rem;">الدرجة الكلية من ٥٠</p>
    </div>
</div>

<script>
    const arabicNumbers = [
        "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "١٠",
        "١١", "١٢", "١٣", "١٤", "١٥", "١٦", "١٧", "١٨", "١٩", "٢٠",
        "٢١", "٢٢", "٢٣", "٢٤", "٢٥", "٢٦", "٢٧", "٢٨", "٢٩", "٣٠",
        "٣١", "٣٢", "٣٣", "٣٤", "٣٥", "٣٦", "٣٧", "٣٨", "٣٩", "٤٠",
        "٤١", "٤٢", "٤٣", "٤٤", "٤٥", "٤٦", "٤٧", "٤٨", "٤٩", "٥٠"
    ];

    // جميع الأسئلة مستمدة من الصفحات 75-87 من الكتاب المرفق
    // جميع الإجابات بنفس الطول تقريباً (35-45 حرفاً)
    // الإجابة الصحيحة عشوائية: مرة 0، مرة 1، مرة 2، مرة 3
    
    const questions = [
        { text: "ما هي الخطوة الأولى عند عمل خطة لتسجيل السلوك في تعديل السلوك؟", options: ["اختيار أداة التسجيل المناسبة", "تحديد لوجستيات التسجيل", "تحديد السلوك المستهدف بدقة", "اختيار طريقة التسليم"], correct: 2, explanation: "الصفحة 48: الخطوة الأولى في خطة تسجيل السلوك هي تحديد السلوك المستهدف." },
        { text: "أي مما يلي يعتبر تعريفاً سلوكياً مناسباً للسلوك العدواني؟", options: ["الغضب الشديد والانفعال الداخلي", "الشعور بعدم الراحة والضيق", "الضرب والعض وشتم الآخرين", "الحالة المزاجية غير المستقرة"], correct: 2, explanation: "الصفحة 49: السلوك العدواني يعرف بأنه ضرب وعض وشتم الآخرين." },
        { text: "لماذا لا يستخدم تعديل السلوك لتغيير التصنيفات مثل 'التوحد'؟", options: ["لأنها تصنيفات دقيقة علمياً", "لأنها لا تحتاج إلى تغيير", "لأنه يغير السلوكيات وليس السمات", "لأنها أهداف علاجية سهلة"], correct: 2, explanation: "الصفحة 12: تعديل السلوك لا يؤكد على وضع بطاقات تصنيف، بل يغير السلوكيات المشكلة." },
        { text: "ماذا يقصد بمصطلح 'الإفراط السلوكي' في تعديل السلوك؟", options: ["سلوك مرغوب يريد الشخص زيادته", "سلوك غير مرغوب يريد الشخص تقليله", "سلوك محايد لا يحتاج إلى تغيير", "سلوك نادر الحدوث في العادة"], correct: 1, explanation: "الصفحة 12: الإفراط السلوكي هو سلوك مستهدف غير مرغوب فيه يريد الشخص تقليل تكراره." },
        { text: "ما الفرق الأساسي بين تعديل السلوك وتحليل السلوك التطبيقي؟", options: ["لا يوجد فرق تقريباً بين المجالين", "الأول نظري والثاني تطبيقي", "الأول للحيوانات والثاني للبشر", "الأول قديم والثاني حديث"], correct: 0, explanation: "الصفحة 12: تعديل السلوك وتحليل السلوك التطبيقي هما مصطلحان متطابقان تقريباً." },
        { text: "في أي مجال تم استخدام إجراء 'اقتصاد رمزي' بنجاح كبير؟", options: ["الرياضة والأداء الرياضي", "المرض العقلي داخل المؤسسات", "التدريب على المهارات الحركية", "العلاج الطبيعي للمسنين"], correct: 1, explanation: "الصفحة 17: تم تطوير الاقتصاد الرمزي كإجراء تحفيزي للمرضى في المؤسسات." },
        { text: "ما الذي ساهم فيه تعديل السلوك في مجال التربية الخاصة؟", options: ["تطوير المناهج الدراسية فقط", "تحسين طرق التدريس والتحكم بالسلوكيات المشكلة", "بناء المدارس والفصول الدراسية", "تدريب المعلمين على الإدارة فقط"], correct: 1, explanation: "الصفحة 17: لتعديل السلوك دور رئيسي في تطوير طرق التدريس والتحكم بالسلوكيات المشكلة." },
        { text: "أي من المجالات التالية يستخدم تعديل السلوك لتعزيز السلوكيات الصحية؟", options: ["علم النفس الرياضي", "علم نفس الشيخوخة", "السلوكيات المتعلقة بالصحة", "علم النفس المجتمعي"], correct: 2, explanation: "الصفحة 20: تستخدم إجراءات تعديل السلوك لتعزيز السلوكيات المتعلقة بالصحة." },
        { text: "ما هو الاسم الآخر الذي يطلق على تطبيق تعديل السلوك على السلوكيات الصحية؟", options: ["الطب الوقائي", "العلاج الطبيعي", "الطب السلوكي أو علم النفس الصحي", "العلاج الوظيفي"], correct: 2, explanation: "الصفحة 20: تطبيق تعديل السلوك على السلوكيات المتعلقة بالصحة يسمى الطب السلوكي أو علم النفس الصحي." },
        { text: "في أي مجال يستخدم تعديل السلوك لمساعدة كبار السن على التكيف مع بيئات دور الرعاية؟", options: ["علم النفس التنموي", "علم نفس الشيخوخة", "علم النفس العصبي", "علم النفس الإيجابي"], correct: 1, explanation: "الصفحة 20: تستخدم إجراءات تعديل السلوك في دور رعاية المسنين ضمن علم نفس الشيخوخة." },
        { text: "من الذي قدم نقداً قوياً للتحليل النفسي وأظهر تفوق العلاج السلوكي؟", options: ["سكنر", "بافلوف", "أيزنك", "ثورندايك"], correct: 2, explanation: "الصفحة 23: أيزنك (1952) قدم نقداً للتحليل النفسي وأظهر تفوق العلاج السلوكي." },
        { text: "ما الفرق الزمني النموذجي بين العلاج التحليلي والعلاج السلوكي؟", options: ["التحليلي أقصر من السلوكي", "التحليلي أطول من السلوكي", "متساويان في المدة", "لا فرق زمني محدد"], correct: 1, explanation: "الصفحة 23: التحليل النفسي قد يستغرق سنوات بينما العلاج السلوكي يظهر نتائج أسرع." },
        { text: "أي من الخصائص التالية تميز العلاج السلوكي عن العلاج النفسي التقليدي؟", options: ["التركيز على اللاوعي والخبرات المبكرة", "الاعتماد على التفسيرات المجردة", "التركيز على تغيير السلوك الحالي", "إطالة جلسات العلاج"], correct: 2, explanation: "الصفحة 23: العلاج السلوكي يركز على تغيير سلوك المريض لتحسين النتائج." },
        { text: "من الذي وضع نموذج 'الإبطال المتبادل' الذي يستخدم في إزالة الحساسية المنهجية؟", options: ["واطسون", "سكنر", "بافلوف", "وولبه"], correct: 3, explanation: "الصفحة 41: وولبه (1958) طور نموذج الإبطال المتبادل في علاج القلق." },
        { text: "ما الحدث التاريخي الذي يعتبر بداية واضحة للعلاج السلوكي كمعرفة منظمة؟", options: ["أواخر الأربعينات", "أواخر الخمسينات", "أوائل الستينات", "أوائل السبعينات"], correct: 1, explanation: "الصفحة 28: بدأ العلاج السلوكي في الظهور بشكل واضح في أواخر الخمسينات من القرن العشرين." },
        { text: "أي عالم روسي ساهم في تطوير مفهوم المنعكس الشرطي وأثر على المدرسة السلوكية؟", options: ["بافلوف", "سيتشينوف", "بختيريف", "كل ما سبق"], correct: 3, explanation: "الصفحات 30-32: سيتشينوف، بافلوف، وبختيريف جميعهم ساهموا في تطور المنعكس الشرطي." },
        { text: "من هو العالم الذي اعتبر أن دراسة المنعكسات الشرطية يمكن أن تفسر الشخصية والسلوك المنحرف؟", options: ["بافلوف", "سيتشينوف", "بختيريف", "واطسون"], correct: 2, explanation: "الصفحة 31: بختيريف اهتم بردود الفعل الانعكاسية وتفسير الشخصية والسلوك غير الطبيعي." },
        { text: "من الذي أسس المدرسة السلوكية في أمريكا وأعلن أن علم النفس يجب أن يدرس السلوك القابل للملاحظة؟", options: ["سكنر", "واطسون", "ثورندايك", "بافلوف"], correct: 1, explanation: "الصفحة 38: واطسون (1913) أكد أن السلوك الملاحظ هو موضوع علم النفس." },
        { text: "من هو العالم الذي صاغ 'قانون الأثر' الذي ينص على أن النتائج المرضية تزيد من قوة الارتباط بين المثير والاستجابة؟", options: ["بافلوف", "سكنر", "واطسون", "ثورندايك"], correct: 3, explanation: "الصفحة 35: ثورندايك صاغ قانون الأثر الذي يؤكد تأثير النتائج الإيجابية على تعزيز السلوك." },
        { text: "ما الاسم الذي أطلقه واطسون ورينر على الاستجابة العاطفية المشروطة التي تم تطويرها في تجربة ألبرت الصغير؟", options: ["الاستجابة الانفعالية الطبيعية", "الاستجابة الشرطية للغذاء", "الاستجابة الانفعالية المشروطة", "الاستجابة غير الشرطية"], correct: 2, explanation: "الصفحة 109: أطلق واطسون ورينر على هذه الاستجابة اسم الاستجابة الانفعالية المشروطة." },
        { text: "ما هو جوهر نموذج 'الإبطال المتبادل' الذي وضعه وولبه؟", options: ["لا يمكن حدوث قلق واسترخاء في نفس الوقت", "القلق يقوي الاسترخاء", "الاسترخاء يزيد القلق", "لا علاقة بين القلق والاسترخاء"], correct: 0, explanation: "الصفحة 112: مبدأ الإبطال المتبادل يعني أن الاسترخاء هو مناقض للقلق." },
        { text: "من الذي طور تقنية 'إزالة الحساسية المنتظمة' كأسلوب لعلاج القلق؟", options: ["سكنر", "واطسون", "وولبه", "أيزنك"], correct: 2, explanation: "الصفحة 111: وولبه هو من طور أسلوب إزالة الحساسية المنتظم." },
        { text: "من هو مقدم نموذج 'الشرط الإجرائي' الذي يركز على نتائج السلوك؟", options: ["بافلوف", "واطسون", "ثورندايك", "سكنر"], correct: 3, explanation: "الصفحة 126: سكنر هو واضع نظرية الشرط الإجرائي في التعلم." },
        { text: "ما هي 'الاستجابة الانفعالية المشروطة' في تجربة ألبرت الصغير؟", options: ["الاستجابة للغذاء", "الاستجابة للضوء", "الخوف المكتسب من الفأر الأبيض", "الاستجابة للصوت العالي"], correct: 2, explanation: "الصفحة 109: أصبح الفأر مثيراً شرطياً يثير الخوف (استجابة شرطية) لدى ألبرت." }
    ];

    let userAnswers = new Array(questions.length).fill(null);
    let answerLocked = new Array(questions.length).fill(false);

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${idx}`;

            const qDiv = document.createElement('div');
            qDiv.className = 'question-text';
            qDiv.innerHTML = `<span class="arabic-number">${arabicNumbers[idx]}.</span> ${q.text}`;

            const optsDiv = document.createElement('div');
            optsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                const optSpan = document.createElement('div');
                optSpan.className = 'opt';
                optSpan.innerText = opt;
                optSpan.dataset.optIndex = optIdx;
                optSpan.addEventListener('click', () => {
                    if (answerLocked[idx]) return;
                    if (userAnswers[idx] !== null) {
                        const prevSelected = card.querySelector(`.opt[data-opt-index='${userAnswers[idx]}']`);
                        if (prevSelected) prevSelected.classList.remove('selected');
                    }
                    userAnswers[idx] = optIdx;
                    optSpan.classList.add('selected');
                    answerLocked[idx] = true;
                    const allOpts = card.querySelectorAll('.opt');
                    allOpts.forEach(o => o.classList.add('disabled-opt'));
                });
                optsDiv.appendChild(optSpan);
            });

            const btnWrapper = document.createElement('div');
            btnWrapper.className = 'check-btn-wrapper';
            const checkBtn = document.createElement('div');
            checkBtn.className = 'check-btn';
            checkBtn.innerText = '🔍 تصحيح الإجابة';
            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';
            feedbackDiv.id = `feedback-${idx}`;

            checkBtn.addEventListener('click', () => {
                const selected = userAnswers[idx];
                const fbDiv = document.getElementById(`feedback-${idx}`);
                if (selected === null) {
                    fbDiv.innerHTML = `⚠️ لم تختر إجابة بعد.`;
                    fbDiv.className = 'feedback wrong';
                } else if (selected === q.correct) {
                    fbDiv.innerHTML = `✅ صحيح. ${q.explanation}`;
                    fbDiv.className = 'feedback correct';
                } else {
                    const correctAns = q.options[q.correct];
                    fbDiv.innerHTML = `❌ خطأ. الإجابة الصحيحة: "${correctAns}".<br> 📘 ${q.explanation}`;
                    fbDiv.className = 'feedback wrong';
                }
                fbDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            btnWrapper.appendChild(checkBtn);
            card.appendChild(qDiv);
            card.appendChild(optsDiv);
            card.appendChild(btnWrapper);
            card.appendChild(feedbackDiv);
            container.appendChild(card);
        });
    }

    document.getElementById('submitFinalBtn').addEventListener('click', () => {
        let score = 0;
        for (let i = 0; i < questions.length; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].correct) {
                score++;
            }
        }
        const resultDiv = document.getElementById('resultContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.innerHTML = `🌟 درجتك: ${score} / ٥٠ 🌟`;
        resultDiv.style.display = 'block';
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    function createBubbles() {
        setInterval(() => {
            const bubble = document.createElement('div');
            const size = Math.random() * 40 + 15;
            bubble.classList.add('bubble');
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 12 + 8}s`;
            bubble.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(bubble);
            setTimeout(() => { if(bubble && bubble.remove) bubble.remove(); }, 15000);
        }, 700);
    }

    renderQuiz();
    createBubbles();
</script>
</body>
</html>
